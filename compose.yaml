services:
  postgres:
    image: postgres:18-alpine
    container_name: e5-atlasis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: e5_atlasis
      POSTGRES_USER: e5_atlasis
      POSTGRES_PASSWORD: e5_atlasis_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - e5_atlasis_pgdata:/var/lib/postgresql

volumes:
  e5_atlasis_pgdata:
