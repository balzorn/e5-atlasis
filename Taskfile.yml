version: '3'

output: group

vars:
  BACKEND_DIR: backend
  DEV_DATABASE_URL: '{{.DATABASE_URL | default "postgres://e5_atlasis:e5_atlasis_dev@127.0.0.1:54329/e5_atlasis?sslmode=disable"}}'
  TEST_DATABASE_URL: '{{.E5_ATLASIS_TEST_DATABASE_URL | default "postgres://e5_atlasis:e5_atlasis_dev@127.0.0.1:54329/e5_atlasis_test?sslmode=disable"}}'
  HTTP_ADDR: '{{.HTTP_ADDR | default "127.0.0.1:8080"}}'
  POSTGRES_SERVICE: postgres
  DEV_DB_NAME: e5_atlasis
  DEV_DB_USER: e5_atlasis
  CONFIRM: '{{.CONFIRM | default "0"}}'

tasks:
  default:
    desc: Show available development tasks
    cmds:
      - task --list

  db:up:
    desc: Start the local PostgreSQL container
    cmds:
      - docker compose up -d postgres

  db:down:
    desc: Stop the local PostgreSQL container
    cmds:
      - docker compose down

  db:status:
    desc: Show local PostgreSQL container status
    cmds:
      - docker compose ps postgres

  db:migrate:
    desc: Apply pending PostgreSQL migrations to the local development database
    cmds:
      - |
        set -eu

        if ! command -v docker >/dev/null 2>&1; then
          echo "Docker is not installed or not available in PATH."
          exit 1
        fi

        if ! docker compose version >/dev/null 2>&1; then
          echo "Docker Compose is not available."
          exit 1
        fi

        if ! postgres_container="$(docker compose ps -q {{.POSTGRES_SERVICE}} 2>/dev/null)"; then
          echo "Cannot inspect PostgreSQL service '{{.POSTGRES_SERVICE}}'."
          echo "Check the Compose configuration and run 'task db:status'."
          exit 1
        fi

        if [ -z "$postgres_container" ]; then
          echo "PostgreSQL container is not running."
          echo "Run 'task db:up' and retry."
          exit 1
        fi

        if ! docker compose exec -T {{.POSTGRES_SERVICE}} pg_isready -U {{.DEV_DB_USER}} -d {{.DEV_DB_NAME}} >/dev/null 2>&1; then
          echo "PostgreSQL container is running, but database '{{.DEV_DB_NAME}}' is not ready."
          echo "Run 'task db:status' and inspect the PostgreSQL container logs."
          exit 1
        fi

        psql_cmd="docker compose exec -T {{.POSTGRES_SERVICE}} psql -U {{.DEV_DB_USER}} -d {{.DEV_DB_NAME}}"

        schema_exists="$($psql_cmd -Atqc "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'information_assets')")"

        $psql_cmd -v ON_ERROR_STOP=1 -c "
          CREATE TABLE IF NOT EXISTS schema_migrations (
            version TEXT PRIMARY KEY,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          )
        "

        migration_count="$($psql_cmd -Atqc "SELECT COUNT(*) FROM schema_migrations")"

        if [ "$schema_exists" = "t" ] && [ "$migration_count" = "0" ]; then
          echo "Migration history is not initialized for the existing database."
          echo "Run 'task db:reset CONFIRM=1' once to recreate the local schema and initialize migration history."
          exit 1
        fi

        for migration in backend/migrations/*.sql; do
          version="$(basename "$migration")"
          applied="$($psql_cmd -Atqc "SELECT CASE WHEN EXISTS (SELECT 1 FROM schema_migrations WHERE version = '$version') THEN 1 ELSE 0 END")"

          if [ "$applied" = "1" ]; then
            continue
          fi

          echo "Applying $version"

          {
            cat "$migration"
            printf "\nINSERT INTO schema_migrations(version) VALUES ('%s');\n" "$version"
          } | docker compose exec -T {{.POSTGRES_SERVICE}} psql -U {{.DEV_DB_USER}} -d {{.DEV_DB_NAME}} -v ON_ERROR_STOP=1 --single-transaction -f -
        done

  db:reset:
    desc: Destructively recreate the local development schema and apply all migrations
    cmds:
      - |
        if [ "{{.CONFIRM}}" != "1" ]; then
          echo "Refusing to reset the development database."
          echo "Use: task db:reset CONFIRM=1"
          exit 1
        fi
      - task: db:up
      - |
        docker compose exec -T {{.POSTGRES_SERVICE}} psql -U {{.DEV_DB_USER}} -d {{.DEV_DB_NAME}} -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - task: db:migrate

  fmt:
    desc: Format all Go packages
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go fmt ./...

  test:unit:
    desc: Run unit tests without PostgreSQL integration tests
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go test ./internal/domain/... ./internal/application/... ./internal/httpapi

  test:
    desc: Run the complete Go test suite
    dir: '{{.BACKEND_DIR}}'
    env:
      E5_ATLASIS_TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - go test ./...

  test:postgres:
    desc: Run PostgreSQL integration tests only
    dir: '{{.BACKEND_DIR}}'
    env:
      E5_ATLASIS_TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
    cmds:
      - go test ./internal/infrastructure/postgres -count=1

  test:race:
    desc: Run the complete Go test suite with the race detector
    dir: '{{.BACKEND_DIR}}'
    env:
      E5_ATLASIS_TEST_DATABASE_URL: '{{.TEST_DATABASE_URL}}'
      CGO_ENABLED: '1'
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go vet ./...

  mod:verify:
    desc: Verify Go module contents
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - go mod verify

  check:
    desc: Run the full local verification suite
    cmds:
      - task: test:unit
      - task: test:postgres
      - task: vet
      - task: mod:verify
      - task: test:race

  api:
    desc: Run the API against the local development database
    dir: '{{.BACKEND_DIR}}'
    env:
      DATABASE_URL: '{{.DEV_DATABASE_URL}}'
      HTTP_ADDR: '{{.HTTP_ADDR}}'
    cmds:
      - go run ./cmd/atlas-api

  dev:
    desc: Start PostgreSQL and then the API
    cmds:
      - task: db:up
      - task: api
