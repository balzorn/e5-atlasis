openapi: 3.1.0

info:
  title: E5-ATLASIS API
  version: 0.1.0
  description: Information Security Asset & Infrastructure System

servers:
  - url: /api/v1

paths:
  /healthz:
    servers:
      - url: /
    get:
      operationId: healthz
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok

  /assets:
    post:
      operationId: createInformationAsset
      summary: Create an Information Asset
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInformationAssetRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Information Asset created
          headers:
            Location:
              description: URL of the created Information Asset
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /assets/{assetId}:
    get:
      operationId: getInformationAsset
      summary: Get an Information Asset
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Information Asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /change-requests:
    post:
      operationId: createChangeRequest
      summary: Create a Change Request
      parameters:
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChangeRequestRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Change Request created
          headers:
            Location:
              description: URL of the created Change Request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /change-requests/{changeRequestId}:
    get:
      operationId: getChangeRequest
      summary: Get a Change Request
      parameters:
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ChangeRequestId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Change Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'


  /change-requests/{changeRequestId}/submit:
    post:
      operationId: submitChangeRequest
      summary: Submit a Change Request
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Change Request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /change-requests/{changeRequestId}/review:
    post:
      operationId: startChangeRequestReview
      summary: Start Change Request review
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Change Request is under review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /change-requests/{changeRequestId}/request-changes:
    post:
      operationId: requestChangeRequestChanges
      summary: Request changes to a Change Request
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Changes requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /change-requests/{changeRequestId}/reject:
    post:
      operationId: rejectChangeRequest
      summary: Reject a Change Request
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Change Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /change-requests/{changeRequestId}/approve:
    post:
      operationId: approveChangeRequest
      summary: Approve a Change Request
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Change Request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /change-requests/{changeRequestId}/apply:
    post:
      operationId: applyChangeRequest
      summary: Apply an approved Change Request
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Updated Information Asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationAsset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /change-requests/{changeRequestId}/approvals:
    get:
      operationId: listChangeRequestApprovals
      summary: List Change Request approvals
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Approval list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: createChangeRequestApproval
      summary: Create an approval for a Change Request
      parameters:
        - $ref: '#/components/parameters/ChangeRequestId'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Approval created
          headers:
            Location:
              description: URL of the created approval
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /approvals/{approvalId}/approve:
    post:
      operationId: approveApproval
      summary: Approve an approval
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Approval approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

  /approvals/{approvalId}/reject:
    post:
      operationId: rejectApproval
      summary: Reject an approval
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Approval rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    ActorId:
      name: X-Actor-ID
      in: header
      required: true
      description: Development-only actor placeholder accepted only when ATLASIS_AUTH_MODE=development-header and HTTP_ADDR binds to a loopback IP; this header is not authentication.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        pattern: '^IA[0-9]{5}$'
      example: IA00001

    ChangeRequestId:
      name: changeRequestId
      in: path
      required: true
      schema:
        type: string
        pattern: '^CR[0-9]{5}$'
      example: CR00001

    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        pattern: '^APR[0-9]{5}$'
      example: APR00001

  responses:
    Unauthorized:
      description: Authentication is required or the principal is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnsupportedMediaType:
      description: Unsupported request media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Resource version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Operation is not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string

    CreateInformationAssetRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - organizationId
        - ownerId
        - criticality
        - riskLevel
        - security
      properties:
        type:
          type: string
          enum:
            - information_system
            - information_infrastructure_object
        name:
          type: string
          minLength: 1
          maxLength: 500
        shortName:
          type: string
          maxLength: 255
        organizationId:
          type: string
          minLength: 1
          maxLength: 128
        ownerId:
          type: string
          minLength: 1
          maxLength: 128
        purpose:
          type: string
          maxLength: 4000
        criticality:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        riskLevel:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        security:
          $ref: '#/components/schemas/SecurityProfile'

    SecurityProfile:
      type: object
      required:
        - protectionRequired
        - protectionStatus
        - attestationStatus
        - cyberCenterRequired
      properties:
        protectionRequired:
          type: boolean
        protectionStatus:
          type: string
          enum:
            - NOT_REQUIRED
            - REQUIRED
            - IN_PROGRESS
            - IMPLEMENTED
        attestationStatus:
          type: string
          enum:
            - NOT_REQUIRED
            - REQUIRED
            - IN_PROGRESS
            - ATTESTED
            - EXPIRED
        cyberCenterRequired:
          type: boolean

    CreateChangeRequestRequest:
      type: object
      additionalProperties: false
      required:
        - assetId
        - baseVersion
        - title
        - changes
      properties:
        assetId:
          type: string
          pattern: '^IA[0-9]{5}$'
        baseVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 4000
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ChangeProposal'

    ChangeProposal:
      type: object
      additionalProperties: false
      required:
        - field
        - newValue
      properties:
        field:
          type: string
          enum:
            - type
            - name
            - short_name
            - status
            - organization_id
            - owner_id
            - purpose
            - criticality
            - risk_level
            - protection_required
            - protection_status
            - attestation_status
            - cyber_center_required
        newValue:
          $ref: '#/components/schemas/FieldValue'

    InformationAsset:
      type: object
      required:
        - id
        - type
        - name
        - shortName
        - status
        - organizationId
        - ownerId
        - purpose
        - criticality
        - riskLevel
        - security
        - currentVersion
      properties:
        id:
          type: string
          pattern: '^IA[0-9]{5}$'
        type:
          type: string
          enum:
            - information_system
            - information_infrastructure_object
        name:
          type: string
        shortName:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - SUSPENDED
            - RETIRED
        organizationId:
          type: string
        ownerId:
          type: string
        purpose:
          type: string
        criticality:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        riskLevel:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        security:
          $ref: '#/components/schemas/SecurityProfile'
        currentVersion:
          type: integer
          minimum: 1

    ChangeRequest:
      type: object
      required:
        - id
        - assetId
        - baseVersion
        - status
        - initiator
        - title
        - description
        - changes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          pattern: '^CR[0-9]{5}$'
        assetId:
          type: string
          pattern: '^IA[0-9]{5}$'
        baseVersion:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - DRAFT
            - SUBMITTED
            - UNDER_REVIEW
            - CHANGES_REQUESTED
            - APPROVED
            - APPLYING
            - APPLIED
            - REJECTED
            - CANCELLED
        initiator:
          type: string
        title:
          type: string
        description:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FieldChange:
      type: object
      required:
        - id
        - field
        - oldValue
        - newValue
      properties:
        id:
          type: string
        field:
          type: string
        oldValue:
          $ref: '#/components/schemas/FieldValue'
        newValue:
          $ref: '#/components/schemas/FieldValue'

    FieldValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - kind
            - value
          properties:
            kind:
              const: string
            value:
              type: string
        - type: object
          additionalProperties: false
          required:
            - kind
            - value
          properties:
            kind:
              const: boolean
            value:
              type: boolean

    CreateApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - required
        - approverId
      properties:
        type:
          $ref: '#/components/schemas/ApprovalType'
        required:
          type: boolean
        approverId:
          type: string
          minLength: 1
          maxLength: 128

    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 4000

    Approval:
      type: object
      required:
        - id
        - changeRequestId
        - type
        - status
        - required
        - approverId
        - comment
      properties:
        id:
          type: string
          pattern: '^APR[0-9]{5}$'
        changeRequestId:
          type: string
          pattern: '^CR[0-9]{5}$'
        type:
          $ref: '#/components/schemas/ApprovalType'
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        required:
          type: boolean
        approverId:
          type: string
        decidedAt:
          type:
            - string
            - 'null'
          format: date-time
        comment:
          type: string

    ApprovalType:
      type: string
      enum:
        - ASSET_OWNER
        - SECURITY
        - ORGANIZATION
        - SYSTEM_OWNER

    ApprovalStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
